name: CI
on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: knok_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -e ".[dev]"
      - name: Tests (SQLite)
        run: pytest
      - name: Tests (Postgres)
        run: pytest
        env:
          KNOK_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/knok_test
      - name: Migraciones al día con los modelos
        run: alembic upgrade head && alembic check
        env:
          KNOK_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/knok_test


  extension:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: extension}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm test
