# Marina mercante: alumnos de puente (Deck Cadet) buscando embarque en navieras.
# Migrado del programa anterior (legacy/core/maritimo.py, webemail.py y correo.py).
slug: marina_mercante
version: 1
names: {es: Marina mercante (alumnos de puente), en: Merchant navy (deck cadets)}
description:
  es: Embarque como alumno de puente en navieras y agencias de tripulación, sobre todo en Europa.
  en: Deck cadet berths with shipping companies and crewing agencies, mainly in Europe.
languages: [es, en]

profile_fields:
  - {key: titulacion, label: {es: Titulación, en: Degree}, localized: true}
  - {key: universidad, label: {es: Universidad / escuela náutica, en: University / nautical school}}

sources:
  default_countries: [es, pt, fr, it, de, nl, be, ie, gb, dk, se, "no", fi, gr, cy, mt, pl, hr]
  wikidata:
    countries: [es, pt, fr, it, de, nl, be, lu, ie, gb, dk, se, "no", fi, is, pl, ee, lv, lt, gr, cy, mt, hr, si, ro, bg, ch, mc]
    queries:
      - {label: Naviera, where: "?item wdt:P31 wd:Q1807108 ."}
      - {label: Cruceros, where: "?item wdt:P31 wd:Q946499 ."}
      - {label: Transporte marítimo, where: "?item wdt:P452 wd:Q155930 ."}
  directories:
    - {url: "https://www.anave.es/images/informes/empresas_navieras/anave_empresas_navieras.pdf", country: es}
    - {url: "https://www.reederverband.de/der-vdr/mitgliederverzeichnis/", country: de}
    - {url: "https://www.rederi.no/vare-medlemmer/", country: "no"}
    - {url: "https://www.armateursdefrance.org/adherents/", country: fr}
    - {url: "https://interferry.com/interferry-public-member-list/"}
  osm:
    tags:
      office: [shipping_agent, company, employment_agency]
    agency_tags: ["office=employment_agency"]
    sector_labels: {shipping_agent: Agente marítimo, company: Empresa, employment_agency: Agencia de tripulación}
  adzuna:
    what: ["deck cadet", "trainee officer", "cadet officer"]
    countries: [gb, nl, de, es]
  infojobs:
    q: ["alumno de puente", "piloto de la marina mercante", "oficial de puente"]

