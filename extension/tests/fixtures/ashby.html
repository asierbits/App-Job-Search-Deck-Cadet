<!doctype html><html><head><title>Cadet Officer @ Aegean Tankers</title></head><body>
<h1>Cadet Officer – LNG Fleet</h1>
<form class="ashby-application-form">
  <div class="_fieldEntry_1"><label for="_systemfield_name">Name</label><input id="_systemfield_name" name="_systemfield_name" type="text" required></div>
  <div class="_fieldEntry_1"><label for="_systemfield_email">Email</label><input id="_systemfield_email" name="_systemfield_email" type="email" required></div>
  <fieldset class="_fieldEntry_1"><legend>Will you now or in the future require visa sponsorship?</legend>
    <label><input type="radio" name="sponsor" value="yes"> Yes</label>
    <label><input type="radio" name="sponsor" value="no"> No</label></fieldset>
  <div class="_fieldEntry_1"><label id="lbl-country">Country of residence</label><input role="combobox" aria-labelledby="lbl-country" type="text"></div>
  <div class="_fieldEntry_1"><label for="cv">Resume</label><input id="cv" type="file" name="_systemfield_resume"></div>
  <iframe src="https://www.google.com/recaptcha/api2/anchor?k=x" title="reCAPTCHA"></iframe>
  <button type="submit">Submit Application</button>
</form>
</body></html>
